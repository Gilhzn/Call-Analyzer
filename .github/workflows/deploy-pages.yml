name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [claude/conversation-analyzer-whisper-f8llbc, main]
    paths: [web/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish web/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
          commit_message: "Deploy browser demo"
