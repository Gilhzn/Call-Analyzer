name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [claude/conversation-analyzer-whisper-f8llbc, main]
    paths: [web/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs without the github-pages environment so it can never be rejected by
  # environment rules; enables Pages via the API on first run and uploads the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # No `environment:` gate — deployment protection rules on the auto-created
  # github-pages environment rejected gated jobs before they could start.
  # deploy-pages authenticates via OIDC and works without the declaration.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
